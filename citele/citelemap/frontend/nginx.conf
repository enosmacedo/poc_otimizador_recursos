server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # O navegador sempre confere se ha versao nova (ETag -> 304 se nao mudou);
        # evita ficar com app.js/style.css antigos depois de uma atualizacao
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Comunicacao frontend -> backend do Citelemap
    location /api/ {
        proxy_pass http://citelemap-backend:3000;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
