<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Citele · cena do vídeo</title>
<style>
  :root { --azul: #1A5FD0; --azul-escuro: #13254A; --vermelho: #D92D20; --texto: #1D2330;
    --suave: #5B6475; --borda: #DCE3EC;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--texto); }
  * { box-sizing: border-box; }
  body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  .cena { width: 1920px; height: 1080px; position: relative; }
  .escura { background: linear-gradient(150deg, #0F1D3B 0%, #13254A 45%, #1A4FB0 100%); color: #fff; }
  .clara { background: #F3F6FA; }
  h1, h2, p { margin: 0; }

  /* capa e fim */
  .centro { display: flex; flex-direction: column; justify-content: center; padding: 0 160px; gap: 40px; }
  .centro .logo { height: 120px; align-self: flex-start; }
  .centro h1 { font-size: 78px; line-height: 1.08; font-weight: 800; max-width: 1400px; }
  .centro p { font-size: 34px; color: #C9D6EA; }
  .contato { font-size: 30px !important; color: #fff !important; padding: 18px 28px; border-radius: 14px;
    background: rgb(255 255 255 / 0.12); border: 2px solid rgb(255 255 255 / 0.3); align-self: flex-start; }

  /* desafio e beneficios */
  .lista { padding: 100px 140px; display: flex; flex-direction: column; justify-content: center; gap: 64px; }
  .lista h2 { font-size: 76px; color: var(--azul-escuro); }
  .escura.lista h2 { color: #fff; }
  .itens { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .item { border-radius: 24px; padding: 56px 48px; min-height: 440px; background: #fff; border: 2px solid var(--borda);
    display: flex; flex-direction: column; gap: 18px; }
  .escura .item { background: rgb(255 255 255 / 0.08); border-color: rgb(255 255 255 / 0.22); }
  .item b { font-size: 46px; line-height: 1.15; }
  .item span { font-size: 33px; line-height: 1.4; color: var(--suave); }
  .escura .item span { color: #C9D6EA; }
  .item i { width: 76px; height: 76px; border-radius: 50%; background: var(--azul); display: grid; place-items: center;
    color: #fff; font-style: normal; font-weight: 800; font-size: 30px; }

  /* telas */
  .tela-cena { display: grid; grid-template-columns: 560px 1fr; gap: 56px; padding: 80px 80px 80px 100px;
    align-items: center; }
  .lateral { display: flex; flex-direction: column; gap: 26px; }
  .lateral .etapa { width: 76px; height: 76px; border-radius: 50%; background: var(--azul); color: #fff;
    display: grid; place-items: center; font-size: 38px; font-weight: 800; }
  .lateral h2 { font-size: 58px; line-height: 1.08; color: var(--azul-escuro); }
  .lateral p { font-size: 30px; line-height: 1.4; color: var(--suave); }
  .destaque { margin-top: 12px; padding: 24px 28px; border-radius: 18px; background: #E7F0FF;
    border: 2px solid #B9CEF5; }
  .destaque b { display: block; font-size: 64px; color: var(--azul); line-height: 1; margin-bottom: 8px; }
  .destaque span { font-size: 25px; color: var(--azul-escuro); line-height: 1.35; }
  .moldura { border-radius: 22px; overflow: hidden; box-shadow: 0 24px 60px rgb(19 37 74 / 0.25);
    border: 2px solid var(--borda); background: #fff; }
  .moldura { height: 860px; background-repeat: no-repeat; }
  .marca { position: absolute; right: 80px; bottom: 38px; height: 46px; opacity: 0.9; }
</style>
</head>
<body>
<div id="raiz"></div>
<script src="cenas.js"></script>
<script>
  const LOGO = "../../logo/citele-logo.svg";
  const LOGO_NEG = "../../logo/citele-logo-negativo.svg";
  const n = Number(location.hash.slice(1) || 0);
  const c = window.CENAS[n];
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m]));
  const itens = (lista) => `<div class="itens">${lista.map(([t, d], i) =>
    `<div class="item"><i>${i + 1}</i><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join("")}</div>`;
  let html;
  if (c.tipo === "capa") {
    html = `<div class="cena escura centro"><img class="logo" src="${LOGO_NEG}" alt="">
      <h1>${esc(c.titulo)}</h1><p>${esc(c.texto)}</p></div>`;
  } else if (c.tipo === "fim") {
    html = `<div class="cena escura centro"><img class="logo" src="${LOGO_NEG}" alt="">
      <h1>${esc(c.titulo)}</h1><p>${esc(c.texto)}</p><p class="contato">${esc(c.contato)}</p></div>`;
  } else if (c.tipo === "desafio") {
    html = `<div class="cena escura lista"><h2>${esc(c.titulo)}</h2>${itens(c.itens)}
      <img class="marca" src="${LOGO_NEG}" alt=""></div>`;
  } else if (c.tipo === "beneficios") {
    html = `<div class="cena clara lista"><h2>${esc(c.titulo)}</h2>${itens(c.itens)}
      <img class="marca" src="${LOGO}" alt=""></div>`;
  } else {
    const destaque = c.destaque ? `<div class="destaque"><b>${esc(c.destaque[0])}</b>
      <span>${esc(c.destaque[1])}</span></div>` : "";
    html = `<div class="cena clara tela-cena">
      <div class="lateral"><span class="etapa">${esc(c.etapa)}</span><h2>${esc(c.titulo)}</h2>
        <p>${esc(c.texto)}</p>${destaque}</div>
      <div class="moldura" data-img="${c.imagem}" data-recorte="${c.recorte}"></div>
      <img class="marca" src="${LOGO}" alt=""></div>`;
  }
  document.getElementById("raiz").innerHTML = html;
  // Recorte "x,y,largura" em coordenadas da captura (1600x900 px CSS)
  for (const el of document.querySelectorAll("[data-recorte]")) {
    const [x, y, w] = el.dataset.recorte.split(",").map(Number);
    const caixa = el.getBoundingClientRect();
    const alt = w * caixa.height / caixa.width;
    el.style.backgroundImage = `url(${el.dataset.img})`;
    el.style.backgroundSize = `${(1600 / w) * 100}% auto`;
    el.style.backgroundPosition = `${(x / (1600 - w)) * 100}% ${(y / (900 - alt)) * 100}%`;
  }
</script>
</body>
</html>
